<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>#30DayMapChallenge Day 4: Starlink Clusters</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #1a3a6e 0%, #0a1628 40%, #000 80%);
      color: #e8f0ff;
    }
    #globeViz {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }
    #globeViz canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    #info {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(8, 16, 32, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 180, 255, 0.28);
      border-radius: 14px;
      padding: 16px 18px;
      max-width: 340px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      z-index: 10;
    }
    #info h1 {
      margin: 0 0 6px 0;
      font-size: 1.35em;
      font-weight: 650;
      background: linear-gradient(90deg, #7dd3fc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #info p { margin: 5px 0; font-size: 0.88em; line-height: 1.45; opacity: 0.92; }
    #stats {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.82em;
    }
    .stat {
      background: rgba(100, 180, 255, 0.12);
      padding: 6px 10px;
      border-radius: 8px;
      text-align: center;
      flex: 1;
    }
    .stat strong { display: block; font-size: 1.25em; color: #7dd3fc; }
    #controls {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      z-index: 10;
      max-width: 90vw;
    }
    button, .ctrl {
      background: rgba(100, 180, 255, 0.15);
      border: 1px solid rgba(100, 180, 255, 0.4);
      color: #fff;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 0.85em;
      transition: all 0.18s;
    }
    button:hover, button.active, .ctrl:hover {
      background: rgba(100, 180, 255, 0.35);
      box-shadow: 0 0 16px rgba(100, 180, 255, 0.35);
    }
    #legend {
      position: absolute;
      bottom: 22px;
      right: 18px;
      background: rgba(8, 16, 32, 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 180, 255, 0.28);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.82em;
      z-index: 10;
      min-width: 150px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
    .swatch { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
    .grad {
      width: 100%;
      height: 12px;
      border-radius: 4px;
      background: linear-gradient(to right, #3b82f6, #06b6d4, #22d3ee, #a78bfa, #f472b6);
      margin: 6px 0 2px;
    }
    #hexRes {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(100, 180, 255, 0.15);
      border: 1px solid rgba(100, 180, 255, 0.4);
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 0.85em;
    }
    #hexRes input { width: 70px; accent-color: #7dd3fc; }
  </style>
</head>
<body>
  <div id="globeViz"></div>
  <div id="loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;font-size:1.1em;opacity:0.8;">Loading globe…</div>
  <div id="info">
    <h1>#30DayMapChallenge</h1>
    <p><strong>Day 4 · Clusters</strong></p>
    <p>Starlink constellation snapshot (~550 km LEO shell). Points rise with orbital altitude. Switch to hexbins to reveal density clusters of the mega-constellation.</p>
    <div id="stats">
      <div class="stat"><strong id="total">–</strong>sats</div>
      <div class="stat"><strong id="v10">–</strong>v1.0</div>
      <div class="stat"><strong id="v15">–</strong>v1.5</div>
    </div>
  </div>
  <div id="legend">
    <div id="legendContent"></div>
  </div>
  <div id="controls">
    <button id="btnPoints" class="active">Points</button>
    <button id="btnClusters">Clusters</button>
    <button id="btnColorVersion">Color: Version</button>
    <button id="btnColorHeight">Color: Height</button>
    <div id="hexRes" style="display:none">
      Hex res <input type="range" id="resSlider" min="2" max="5" value="3" step="1">
      <span id="resLabel">3</span>
    </div>
    <button id="btnRotate">Pause</button>
  </div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script>
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
      .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
      .backgroundColor('#0a1628')
      .atmosphereColor('rgba(120, 190, 255, 0.55)')
      .atmosphereAltitude(0.18)
      .pointOfView({ altitude: 2.4 }, 0);

    let satData = [];
    let isRotating = true;
    let mode = 'points';
    let colorMode = 'version'; // 'version' | 'height'
    let hexRes = 3;

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.35;

    // Height color scale: 300km (deep blue) → 550km (cyan) → 600km (pink)
    function heightColor(h) {
      const t = Math.max(0, Math.min(1, (h - 320) / 270));
      const colors = [
        [59, 130, 246],   // blue
        [6, 182, 212],    // cyan
        [34, 211, 238],   // light cyan
        [167, 139, 250],  // purple
        [244, 114, 182]   // pink
      ];
      const i = t * (colors.length - 1);
      const lo = Math.floor(i);
      const hi = Math.min(lo + 1, colors.length - 1);
      const f = i - lo;
      const c = colors[lo].map((v, idx) => Math.round(v + (colors[hi][idx] - v) * f));
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }

    function densityColor(count) {
      const t = Math.min(count / 35, 1);
      const r = Math.floor(40 + t * 200);
      const g = Math.floor(160 - t * 40);
      const b = Math.floor(255 - t * 80);
      return `rgb(${r},${g},${b})`;
    }

    function updateLegend() {
      const el = document.getElementById('legendContent');
      if (mode === 'clusters') {
        el.innerHTML = `
          <div style="margin-bottom:6px;font-weight:600">Cluster density</div>
          <div class="grad" style="background:linear-gradient(to right,#2888ff,#50b0ff,#70c8ff,#90d0ff,#f0f8ff)"></div>
          <div style="display:flex;justify-content:space-between;font-size:0.75em;opacity:0.8">
            <span>few</span><span>many</span>
          </div>
          <div style="margin-top:8px;opacity:0.75">Hex resolution ${hexRes}</div>
        `;
      } else if (colorMode === 'height') {
        el.innerHTML = `
          <div style="margin-bottom:6px;font-weight:600">Orbital height</div>
          <div class="grad"></div>
          <div style="display:flex;justify-content:space-between;font-size:0.75em;opacity:0.8">
            <span>320 km</span><span>590 km</span>
          </div>
        `;
      } else {
        el.innerHTML = `
          <div style="margin-bottom:4px;font-weight:600">Version</div>
          <div class="legend-item"><div class="swatch" style="background:#64d2ff"></div> v1.0</div>
          <div class="legend-item"><div class="swatch" style="background:#c084fc"></div> v1.5</div>
        `;
      }
    }

    function applyView() {
      if (mode === 'points') {
        world
          .pointsData(satData)
          .pointLat('lat')
          .pointLng('lng')
          .pointAltitude(d => d.alt * 1.15) // slight boost for visibility
          .pointColor(d => colorMode === 'height' ? heightColor(d.height) : (d.version === 'v1.5' ? '#c084fc' : '#64d2ff'))
          .pointRadius(0.11)
          .pointLabel(d => `
            <div style="font-size:13px;padding:2px 4px">
              <b>Starlink</b> ${d.version}<br>
              Height: <b>${d.height} km</b><br>
              Speed: ${d.vel} km/s
            </div>
          `)
          .hexBinPointsData([]);
        document.getElementById('hexRes').style.display = 'none';
      } else {
        world
          .pointsData([])
          .hexBinPointsData(satData)
          .hexBinPointLat('lat')
          .hexBinPointLng('lng')
          .hexBinPointWeight(1)
          .hexBinResolution(hexRes)
          .hexMargin(0.12)
          .hexAltitude(d => Math.min(0.04 + d.sumWeight * 0.007, 0.4))
          .hexTopColor(d => densityColor(d.sumWeight))
          .hexSideColor(d => densityColor(d.sumWeight))
          .hexLabel(d => `
            <div style="font-size:13px;padding:2px 4px">
              <b>${d.sumWeight}</b> satellites<br>
              clustered here
            </div>
          `)
          .hexBinMerge(true);
        document.getElementById('hexRes').style.display = 'flex';
      }
      updateLegend();
    }

    document.getElementById('btnPoints').onclick = () => {
      mode = 'points';
      document.getElementById('btnPoints').classList.add('active');
      document.getElementById('btnClusters').classList.remove('active');
      applyView();
    };
    document.getElementById('btnClusters').onclick = () => {
      mode = 'clusters';
      document.getElementById('btnClusters').classList.add('active');
      document.getElementById('btnPoints').classList.remove('active');
      applyView();
    };
    document.getElementById('btnColorVersion').onclick = () => {
      colorMode = 'version';
      document.getElementById('btnColorVersion').classList.add('active');
      const loadEl = document.getElementById('loading');
      if (loadEl) loadEl.style.display = 'none';
      document.getElementById('btnColorHeight').classList.remove('active');
      if (mode === 'points') applyView();
    };
    document.getElementById('btnColorHeight').onclick = () => {
      colorMode = 'height';
      document.getElementById('btnColorHeight').classList.add('active');
      document.getElementById('btnColorVersion').classList.remove('active');
      if (mode === 'points') applyView();
    };
    document.getElementById('resSlider').oninput = (e) => {
      hexRes = +e.target.value;
      document.getElementById('resLabel').textContent = hexRes;
      if (mode === 'clusters') applyView();
    };
    document.getElementById('btnRotate').onclick = () => {
      isRotating = !isRotating;
      world.controls().autoRotate = isRotating;
      document.getElementById('btnRotate').textContent = isRotating ? 'Pause' : 'Resume';
    };

    window.initData = function(data) {
      satData = data;
      const v10 = data.filter(d => d.version === 'v1.0').length;
      const v15 = data.filter(d => d.version === 'v1.5').length;
      document.getElementById('total').textContent = data.length.toLocaleString();
      document.getElementById('v10').textContent = v10.toLocaleString();
      document.getElementById('v15').textContent = v15.toLocaleString();
      document.getElementById('btnColorVersion').classList.add('active');
      const loadEl = document.getElementById('loading');
      if (loadEl) loadEl.style.display = 'none';
      applyView();
    };

    setTimeout(() => world.width(window.innerWidth).height(window.innerHeight), 100);
    window.addEventListener('resize', () => {
      world.width(window.innerWidth).height(window.innerHeight);
    });
